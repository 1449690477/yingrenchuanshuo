name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # ── 纯文档改动不触发部署 ──
    # 协作聊天室（docs/34）每发一条消息就产生一次提交，发版清单（docs/72）
    # 每有人交付一次也要改。这些提交此前每一个都会触发完整部署
    # （npm ci + verify + build，数分钟），而且**因为 concurrency 组会取消
    # 上一次正在跑的部署** —— 实测 2026-07-31 16:2x 那段，连续两次真实代码
    # 的部署被随后的文档提交挤掉，只有最后一次活下来。
    #
    # docs/ 不参与构建（应用代码里对 docs 的引用只出现在注释中），
    # 所以排除它是安全的。**只含 docs/ 的推送才会被跳过**；
    # 代码与文档一起推时照常部署。
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 见 AGENTS.md：verify 不过就不允许上线
      - name: 校验（lint + typecheck + test）
        run: npm run verify

      - name: 构建
        run: npm run build
        env:
          # Supabase 联机接入（见 docs/51）。
          # 在仓库 Settings → Secrets and variables → Actions 里配置同名 secret。
          # 未配置时为空字符串，客户端应据此关闭联机功能并照常离线可玩 ——
          # 绝不能因为缺这两个值就让构建失败或游戏打不开。
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
