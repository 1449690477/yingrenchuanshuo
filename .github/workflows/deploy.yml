name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # ── 纯文档改动不触发部署 ──
    # 协作聊天室（docs/34）每发一条消息就产生一次提交，发版清单（docs/72）
    # 每有人交付一次也要改。这些提交此前每一个都会触发完整部署
    # （npm ci + verify + build，数分钟），而且**因为 concurrency 组会取消
    # 上一次正在跑的部署** —— 实测 2026-07-31 16:2x 那段，连续两次真实代码
    # 的部署被随后的文档提交挤掉，只有最后一次活下来。
    #
    # docs/ 不参与构建（应用代码里对 docs 的引用只出现在注释中），
    # 所以排除它是安全的。**只含 docs/ 的推送才会被跳过**；
    # 代码与文档一起推时照常部署。
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 见 AGENTS.md：verify 不过就不允许上线。
      #
      # ── 为什么拆成多步而不是一句 npm run verify ──
      # 2026-08-02 樱酱资产门禁在 Linux 上连红四次，而日志 API 需要仓库
      # 管理员权限 —— 在共享工作区里协作的 AI 全都看不到日志，只能盲修。
      # 巨型单步的失败信息只有「exit code 1」；拆开之后**失败的步骤名
      # 本身就是公开可读的定位信息**（check-runs API 无需任何权限）。
      # 拆分不改变任何被验内容，与本地 npm run verify 的覆盖完全一致。
      - name: 校验·代码（chat + lint + typecheck + test）
        run: npm run chat:test && npm run lint && npm run typecheck && npm run test

      - name: 校验·模拟与平衡（sim + balance)
        run: npm run sim && npm run balance:equipment-dungeon

      - name: 校验·樱酱资产（kenshi + kenshi-source）
        run: npm run assets:kenshi:check && npm run assets:kenshi:source-check

      - name: 校验·其余资产门禁
        run: npm run assets:encounters:check && npm run assets:affection:check && npm run assets:reforge:check && npm run assets:arena:check && npm run assets:trial:check && npm run assets:guild:check && npm run assets:equipment-dungeon:check && npm run assets:region34:check && npm run assets:region5:check && npm run assets:region6:check && npm run assets:region7:check && npm run assets:weapon-icons:check

      # 失败时把完整输出留成 artifact —— 有仓库权限的人（老板）可下载给
      # 频道里的修复者；没有权限的人至少能从上面的步骤名知道断在哪一类。
      - name: 失败日志归档
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failure-logs
          path: |
            npm-debug.log*
            scripts/out/**
          if-no-files-found: ignore

      - name: 构建
        run: npm run build
        env:
          # Supabase 联机接入（见 docs/51）。
          # 在仓库 Settings → Secrets and variables → Actions 里配置同名 secret。
          # 未配置时为空字符串，客户端应据此关闭联机功能并照常离线可玩 ——
          # 绝不能因为缺这两个值就让构建失败或游戏打不开。
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
